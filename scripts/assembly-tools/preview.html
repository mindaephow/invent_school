<!doctype html><meta charset="utf-8"><title>로봇팽이 조립도 미리보기</title>
<style>html,body{margin:0;background:#f4f6fb;font-family:sans-serif;overflow:hidden}
#bar{position:fixed;left:0;right:0;top:0;padding:8px 12px;background:#fffd;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #ccd}
#note{position:fixed;left:0;right:0;bottom:0;padding:8px 12px;background:#fffe;z-index:5;font-size:14px;min-height:20px}
button{padding:5px 10px;font-size:14px}canvas{position:absolute;left:0;top:0}</style>
<div id="bar"><button id="prev">◀ 이전</button><b id="lab"></b><button id="next">다음 ▶</button><input id="sl" type="range" min="0" value="1" style="width:260px"><span style="color:#667;font-size:12px">드래그=회전 · 휠=확대 · 오른쪽드래그=이동</span></div>
<div id="note"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="parts.js"></script><script src="conn.js"></script><script>document.write('<script src="da.js?'+Date.now()+'"><\/script>')</script>
<script>
const D=Math.PI/180, W=innerWidth, H=innerHeight;
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(W,H);document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xf4f6fb);
scene.add(new THREE.AmbientLight(0xffffff,0.8));const dl=new THREE.DirectionalLight(0xffffff,0.6);dl.position.set(0.5,1,0.8);scene.add(dl);
const dl2=new THREE.DirectionalLight(0xffffff,0.3);dl2.position.set(-0.8,0.3,-0.5);scene.add(dl2);
const grid=new THREE.GridHelper(400,20,0xc8ccd8,0xdfe2ea);grid.position.y=0;scene.add(grid);
const cam=new THREE.PerspectiveCamera(35,W/H,1,8000);
const ID=new URLSearchParams(location.search).get('id')||'cubo-1-spinner';
let def=IVS_ASSEMBLIES.find(a=>a.id===ID);
  // ── 로봇 뒤집기(def.flip): 교재가 "반대로 뒤집기"로 로봇을 뒤집어 그리는 차시용 ──
  // 조립 데이터(p·r·marks·dir …)는 모두 "뒤집은 뒤(최종 방향)"로 적어 두고, def.flip.ranges 에 든 단계에서는 화면에 뒤집기 전 모양
  // (교재가 그린 방향)으로 바꿔 보여 준다. 변환: (x,y,z) → (x, flip.y − y, flip.z − z), 회전은 x축 180° 뒤집기 — 두 번 하면 제자리라 양쪽 어느 방향이든 같은 식이다.
  const D2R = Math.PI / 180;
  function matFromEuler(r) {
    const a = r[0] * D2R, b = r[1] * D2R, c = r[2] * D2R;
    const cx = Math.cos(a), sx = Math.sin(a), cy = Math.cos(b), sy = Math.sin(b), cz = Math.cos(c), sz = Math.sin(c);
    return [[cz * cy, cz * sy * sx - sz * cx, cz * sy * cx + sz * sx], [sz * cy, sz * sy * sx + cz * cx, sz * sy * cx - cz * sx], [-sy, cy * sx, cy * cx]];
  }
  function eulerFromMat(R) {
    const sy = Math.max(-1, Math.min(1, -R[2][0]));
    const ry = Math.asin(sy);
    let rx, rz;
    if (Math.abs(sy) < 0.99999) { rx = Math.atan2(R[2][1], R[2][2]); rz = Math.atan2(R[1][0], R[0][0]); } else { rx = Math.atan2(-R[1][2], R[1][1]); rz = 0; }
    return [rx / D2R, ry / D2R, rz / D2R].map((v) => Math.round(v * 1e4) / 1e4 + 0);
  }
  function flipActive(target) { return !!(def && def.flip && (def.flip.ranges || []).some((rg) => target >= rg[0] && target <= rg[1])); }
  function flipPt(pt) {
    const f = def.flip;
    const P = (p) => [p[0], f.y - p[1], f.z - p[2]];
    const V = (v) => [v[0], -v[1], -v[2]];
    const R = (r) => { const A = matFromEuler(r || [0, 0, 0]); return eulerFromMat([A[0], [-A[1][0], -A[1][1], -A[1][2]], [-A[2][0], -A[2][1], -A[2][2]]]); };
    const o = Object.assign({}, pt);
    o.p = P(pt.p); o.r = R(pt.r);
    ['marks', 'faceMarks', 'settleMarks'].forEach((k) => { if (pt[k]) o[k] = pt[k].map(P); });
    ['dir', 'settleDir'].forEach((k) => { if (pt[k]) o[k] = V(pt[k]); });
    if (pt.side) o.side = Object.assign({}, pt.side, { p: P(pt.side.p), r: R(pt.side.r) });
    if (pt.explode) { const e = pt.explode; o.explode = Object.assign({}, e, { offset: e.offset ? V(e.offset) : e.offset, from: e.from ? P(e.from) : e.from, marks: e.marks ? e.marks.map(P) : e.marks }); }
    return o;
  }


const steps=def.steps; const N=steps.length+1;
let step=+(new URLSearchParams(location.search).get('step')||N), az=36, el=38, dist=420, tgt=new THREE.Vector3(30,10,30);
const sl=document.getElementById('sl');sl.max=N;
function rot(r){return new THREE.Quaternion().setFromEuler(new THREE.Euler(r[0]*D,r[1]*D,r[2]*D,'ZYX'));}
const gc={};function geo(n){if(gc[n])return gc[n];const b=atob(PARTS[n].pos);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(u.buffer),3));g.computeVertexNormals();return gc[n]=g;}
let group=new THREE.Group();scene.add(group);
function build(){scene.remove(group);group=new THREE.Group();scene.add(group);const box=new THREE.Box3();
 const flipOn=flipActive(step);
 steps.forEach((st,si)=>{if(si+1>step)return;(st.parts||[]).forEach(pt0=>{const pt=(flipOn&&!pt0.noflip)?flipPt(pt0):pt0;if(!PARTS[pt.n])return;const use=(pt.side&&pt.side.until>step)?pt.side:pt;const isNew=(si+1===step)||(pt.side&&pt.side.until===step);
  const m=new THREE.Mesh(geo(pt.n),new THREE.MeshStandardMaterial({color:new THREE.Color(PARTS[pt.n].color).multiplyScalar(isNew?1.0:0.88),flatShading:true,roughness:0.75,emissive:isNew?0x330022:0x000000}));
  m.position.set(...use.p);m.quaternion.copy(rot(use.r||[0,0,0]));group.add(m);
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(geo(pt.n),35),new THREE.LineBasicMaterial({color:isNew?0xe0007a:0x333344}));e.position.copy(m.position);e.quaternion.copy(m.quaternion);group.add(e);box.expandByObject(m);});});
 if(!box.isEmpty()){box.getCenter(tgt);}
 document.getElementById('lab').textContent=step+' / '+N+' 단계';document.getElementById('note').textContent=step>=N?'완성!':((steps[step-1]||{}).note||'');sl.value=step;}
function draw(){const a=az*D,e=el*D;cam.position.set(tgt.x+dist*Math.sin(a)*Math.cos(e),tgt.y+dist*Math.sin(e),tgt.z+dist*Math.cos(a)*Math.cos(e));cam.lookAt(tgt);renderer.render(scene,cam);}
function go(s){step=Math.max(1,Math.min(N,s));build();draw();}
document.getElementById('prev').onclick=()=>go(step-1);document.getElementById('next').onclick=()=>go(step+1);sl.oninput=()=>go(+sl.value);
let drag=null;renderer.domElement.onmousedown=e=>{drag={x:e.clientX,y:e.clientY,btn:e.button}};
addEventListener('mouseup',()=>drag=null);addEventListener('mousemove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
 if(drag.btn===2){const rt=new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld,0),up=new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld,1);tgt.addScaledVector(rt,-dx*dist/500).addScaledVector(up,dy*dist/500);}else{az-=dx*0.4;el=Math.max(-5,Math.min(89,el+dy*0.4));}draw();});
renderer.domElement.oncontextmenu=e=>e.preventDefault();
addEventListener('wheel',e=>{dist*=e.deltaY>0?1.1:0.9;draw();});
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(step+1);if(e.key==='ArrowLeft')go(step-1);});
go(step);
</script>
