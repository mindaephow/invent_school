<title>설계 종류 선택 — 발명융합과학교실</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root{
    --bg:#F3F5F9;
    --surface:#FFFFFF;
    --border:#E1E5EE;
    --ink:#1E2433;
    --ink-soft:#5B6478;
    --accent:#3452C7;
    --accent-soft:#E3E8FB;
    --accent-ink:#FFFFFF;
    --shadow:0 8px 24px rgba(30,36,51,0.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121722; --surface:#1A2130; --border:#2A3244; --ink:#E9ECF4; --ink-soft:#9AA3BC;
      --accent:#7D93FF; --accent-soft:#212B4A; --accent-ink:#0E1220;
      --shadow:0 8px 24px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#121722; --surface:#1A2130; --border:#2A3244; --ink:#E9ECF4; --ink-soft:#9AA3BC;
    --accent:#7D93FF; --accent-soft:#212B4A; --accent-ink:#0E1220;
    --shadow:0 8px 24px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--ink); margin:0;
    font-family:'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    word-break:keep-all; letter-spacing:-0.01em;
    padding-inline:16px; padding-block:18px 40px;
  }
  h1{margin:0 0 6px; font-size:22px; text-wrap:balance;}
  p{margin:0 0 8px; line-height:1.5;}
  .app{max-width:840px; margin:0 auto;}
  .topbar{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; margin-bottom:18px;}
  .brand{display:inline-flex; align-items:center; gap:10px; font-weight:800; font-size:19px; letter-spacing:-0.04em; color:inherit; text-decoration:none;}
  .brand .logo{width:32px; height:32px; border-radius:10px; flex:none;}
  .back-link{display:inline-block; font-size:13px; color:var(--ink-soft); text-decoration:none; margin-bottom:14px;}
  .back-link:hover{color:var(--ink);}
  .intro{margin-bottom:22px;}
  .intro .note{font-size:14px; color:var(--ink-soft);}
  .subject-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:14px;}
  @media (max-width:640px){ .subject-grid{grid-template-columns:1fr;} }
  .subject-card{
    display:flex; flex-direction:column; align-items:flex-start; gap:8px; text-align:left;
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:22px 18px; box-shadow:var(--shadow); text-decoration:none; color:var(--ink);
    transition:border-color .15s, transform .15s;
  }
  .subject-card:hover{border-color:var(--accent); transform:translateY(-2px);}
  .subject-card .icon{font-size:32px; line-height:1;}
  .subject-card .title{font-weight:700; font-size:17px;}
  .subject-card .desc{font-size:13px; color:var(--ink-soft); line-height:1.5;}
  .subject-card .badge{
    display:inline-block; font-size:11px; font-weight:600; color:var(--accent);
    background:var(--accent-soft); border-radius:999px; padding:3px 9px; margin-top:2px;
  }
</style>

<div class="app">
  <header class="topbar">
    <a class="brand" href="index.html"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10" fill="#2D5BFF"/><path d="M6 10 L20 15" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M12 23 L26 19" stroke="#fff" stroke-opacity="0.7" stroke-width="2.6" stroke-linecap="round"/><circle cx="9" cy="6.5" r="3" fill="#FF6A3D"/></svg>발명융합과학교실</a>
  </header>

  <a class="back-link" href="index.html">← 선생님 화면으로</a>

  <div class="intro">
    <h1>설계 종류를 선택하세요</h1>
    <p class="note">선택한 종류로 설계 화면에 들어가요.</p>
  </div>

  <div class="subject-grid">
    <a class="subject-card" href="design.html?subject=goldberg">
      <span class="icon">🪀</span>
      <span class="title">골드버그</span>
      <span class="desc">구슬이 굴러가는 장치를 3D로 설계해요.</span>
    </a>
    <a class="subject-card" href="design.html?subject=robot">
      <span class="icon">🤖</span>
      <span class="title">로봇</span>
      <span class="desc">같은 설계 화면으로 들어가요.</span>
      <span class="badge">커리큘럼 준비 중</span>
    </a>
    <a class="subject-card" href="design.html?subject=aviation">
      <span class="icon">✈️</span>
      <span class="title">항공</span>
      <span class="desc">같은 설계 화면으로 들어가요.</span>
      <span class="badge">커리큘럼 준비 중</span>
    </a>
  </div>
</div>
