<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>본사 관리자 · 발명융합과학교실</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="db-shim.js"></script>
<style>
  :root{
    --bg:#F3F5F9; --surface:#FFFFFF; --border:#E1E5EE; --ink:#1E2433; --ink-soft:#5B6478;
    --accent:#3452C7; --accent-soft:#E3E8FB; --accent-ink:#FFFFFF;
    --present:#1F8F4C; --present-bg:#E4F6EA; --late:#B9740E; --late-bg:#FBF0DD;
    --absent:#C23B3B; --absent-bg:#FBE7E7; --shadow:0 8px 24px rgba(30,36,51,0.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121722; --surface:#1A2130; --border:#2A3244; --ink:#E9ECF4; --ink-soft:#9AA3BC;
      --accent:#7D93FF; --accent-soft:#212B4A; --accent-ink:#0E1220;
      --present:#4FCB78; --present-bg:#132A1D; --late:#E3A63C; --late-bg:#2E230E;
      --absent:#F0716B; --absent-bg:#301717; --shadow:0 8px 24px rgba(0,0,0,0.45);
    }
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    word-break:keep-all; letter-spacing:-0.01em; padding-inline:16px; padding-block:18px 40px;
  }
  h3{margin:0 0 10px;}
  p{margin:0 0 8px; line-height:1.5;}
  button, input, select{font-family:inherit; font-size:14px;}
  button{cursor:pointer; border-radius:9px; border:1px solid var(--border); background:var(--surface); color:var(--ink); padding:9px 14px;}
  button:disabled{opacity:0.5; cursor:not-allowed;}
  button.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600;}
  button.ghost{background:transparent;}
  button.danger-armed{background:var(--absent-bg); border-color:var(--absent); color:var(--absent); font-weight:700;}
  input, select{border:1px solid var(--border); border-radius:8px; padding:8px 10px; background:var(--surface); color:var(--ink); width:100%;}
  input:focus, select:focus, button:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:4px; font-weight:600;}

  .app{max-width:840px; margin:0 auto;}
  .topbar{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; margin-bottom:18px;}
  .brand{display:inline-flex; align-items:center; gap:10px; font-weight:800; font-size:19px; letter-spacing:-0.04em; color:inherit; text-decoration:none;}
  .brand .logo{width:32px; height:32px; border-radius:10px; flex:none;}
  .brand small{font-size:12px; font-weight:600; color:var(--accent); background:var(--accent-soft); padding:3px 9px; border-radius:999px; letter-spacing:0;}
  .chip{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:6px 12px;}
  .chip button{padding:3px 9px; font-size:12px;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:14px; box-shadow:var(--shadow);}
  .google-btn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; font-weight:600;}
  .google-btn svg{width:18px; height:18px; flex:none;}
  .or{display:flex; align-items:center; gap:10px; color:var(--ink-soft); font-size:12px; margin:2px 0;}
  .or::before, .or::after{content:""; flex:1; height:1px; background:var(--border);}
  .back-link{display:inline-block; font-size:13px; color:var(--ink-soft); text-decoration:none; margin-bottom:10px;}
  .back-link:hover{color:var(--ink);}
  .form{display:grid; gap:10px;}
  .note{font-size:13px; color:var(--ink-soft);}
  .err{color:var(--absent);}
  .count{display:inline-block; margin-left:6px; font-size:12px; font-weight:700; padding:2px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent);}
  .count.warn{background:var(--late-bg); color:var(--late);}
  .row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0; border-top:1px solid var(--border);}
  .row:first-of-type{border-top:none;}
  .who{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .who b{font-weight:700;}
  .who span{font-size:13px; color:var(--ink-soft); overflow-wrap:anywhere;}
  .empty{color:var(--ink-soft); font-size:14px; padding:6px 0;}
  .acts{display:flex; gap:8px; flex:none; align-items:center;}
  .toolbar{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .toolbar h3{margin:0;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  #createForm{margin-top:14px; padding-top:14px; border-top:1px dashed var(--border);}
  #createForm[hidden]{display:none;}
  @media (max-width:520px){ .row{flex-direction:column; align-items:stretch;} .acts{flex-direction:column; align-items:stretch;} .acts button{width:100%;} .grid2{grid-template-columns:1fr;} }
</style>

<div class="app">
  <header class="topbar">
    <a class="brand" href="/">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10" fill="#2D5BFF"/><path d="M6 10 L20 15" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M12 23 L26 19" stroke="#fff" stroke-opacity="0.7" stroke-width="2.6" stroke-linecap="round"/><circle cx="9" cy="6.5" r="3" fill="#FF6A3D"/></svg>
      발명융합과학교실 <small>본사 관리자</small>
    </a>
    <div class="chip" id="chip" hidden></div>
  </header>

  <section id="loginCard" class="card" style="max-width:420px; margin-inline:auto;">
    <a class="back-link" href="/">← 처음으로</a>
    <h3 style="font-size:16px;">본사 관리자 로그인</h3>
    <form id="loginForm" class="form">
      <div><label for="email">이메일</label><input id="email" type="email" required autocomplete="username"></div>
      <div><label for="password">비밀번호</label><input id="password" type="password" required autocomplete="current-password"></div>
      <p class="note err" id="msg" hidden></p>
      <button type="submit" class="primary" id="loginBtn">로그인</button>
      <div class="or">또는</div>
      <button type="button" class="google-btn" id="googleBtn"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.3.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Google로 계속하기</button>
    </form>
  </section>

  <div id="body" hidden>
    <section class="card">
      <div class="toolbar"><h3 style="font-size:16px;">선생님 등록</h3><button type="button" id="toggleCreate">+ 선생님 등록</button></div>
      <form id="createForm" class="form" hidden>
        <div class="grid2">
          <div><label for="cName">성함</label><input id="cName" required autocomplete="off"></div>
          <div><label for="cPhone">전화번호</label><input id="cPhone" autocomplete="off"></div>
        </div>
        <div><label for="cEmail">이메일 (구글 로그인에 쓰는 이메일)</label><input id="cEmail" type="email" required autocomplete="off"></div>
        <div><label for="cPassword">비밀번호 (6자 이상) — 구글로 로그인할 선생님은 비워두세요</label><input id="cPassword" type="text" minlength="6" autocomplete="off"></div>
        <p class="note err" id="createMsg" hidden></p>
        <button type="submit" class="primary" id="createBtn">등록 (바로 승인됨)</button>
      </form>
    </section>
    <section class="card">
      <h3 style="font-size:16px;">승인 대기<span class="count warn" id="pendingCount">0</span></h3>
      <div id="pendingList"></div>
    </section>
    <section class="card">
      <h3 style="font-size:16px;">승인된 선생님<span class="count" id="approvedCount">0</span></h3>
      <div id="approvedList"></div>
    </section>
    <section class="card">
      <div class="toolbar"><h3 style="font-size:16px;">부품 등록</h3><button type="button" id="toggleCreatePart">+ 부품 등록</button></div>
      <p class="note">이름·아이콘만 등록해요. 실제 3D 모양·동작은 별도로 구현한 뒤에 설계 화면에서 쓸 수 있어요.</p>
      <form id="createPartForm" class="form" hidden>
        <div class="grid2">
          <div><label for="pName">부품 이름</label><input id="pName" required autocomplete="off"></div>
          <div><label for="pIcon">아이콘 (이모지)</label><input id="pIcon" placeholder="예: 🤖" autocomplete="off"></div>
        </div>
        <div class="grid2">
          <div><label for="pQty">수량</label><input id="pQty" type="number" min="1" step="1" autocomplete="off"></div>
          <div><label for="pColor">색상</label><input id="pColor" placeholder="예: 레드" autocomplete="off"></div>
        </div>
        <div class="grid2">
          <div><label for="pSubject">과목</label><select id="pSubject" required><option value="robot">로봇</option><option value="aviation">항공</option></select></div>
          <div id="pCategoryWrap"><label for="pCategory">카테고리 (로봇만)</label><select id="pCategory"><option value="">(전체 공통)</option></select></div>
        </div>
        <div id="pVolumeWrap"><label for="pVolume">권 (로봇만, 비우면 전체 공통)</label><input id="pVolume" type="number" min="1" step="1" autocomplete="off"></div>
        <p class="note err" id="createPartMsg" hidden></p>
        <button type="submit" class="primary" id="createPartBtn">등록</button>
      </form>
      <div id="partList"></div>
    </section>
    <section class="card">
      <div class="toolbar"><h3 style="font-size:16px;">로봇 카테고리 관리</h3><button type="button" id="toggleCreateCategory">+ 카테고리 등록</button></div>
      <p class="note">브랜드 이름과 권 수만 등록해요. 실제 차시 내용은 나중에 채워요.</p>
      <form id="createCategoryForm" class="form" hidden>
        <input type="hidden" id="rId">
        <div class="grid2">
          <div><label for="rName">카테고리 이름</label><input id="rName" required autocomplete="off"></div>
          <div><label for="rVolumes">권 수</label><input id="rVolumes" type="number" min="1" step="1" required autocomplete="off"></div>
        </div>
        <p class="note err" id="createCategoryMsg" hidden></p>
        <button type="submit" class="primary" id="createCategoryBtn">등록</button>
      </form>
      <div id="categoryList"></div>
    </section>
  </div>
</div>

<script>
(function(){
  const db = createSupabaseDb('https://brfeszcyjsaprbakqsjl.supabase.co', 'sb_publishable_0Nsga8WVTqBcBS6kcUytrg_UB-1FtnK', { storageKey: 'ivs-teacher-auth', detectSessionInUrl: true });
  const $ = (id) => document.getElementById(id);
  const loginCard = $('loginCard'), body = $('body'), chip = $('chip'), msg = $('msg'), loginBtn = $('loginBtn');

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function showMsg(t){ msg.textContent = t; msg.hidden = !t; }
  function fmtDate(iso){
    const d = new Date(iso);
    return isNaN(d) ? '' : d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
  }

  async function api(payload, token){
    const res = await fetch('/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify(payload) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { const e = new Error(data.error || '요청을 처리하지 못했어요.'); e.status = res.status; throw e; }
    return data;
  }
  async function token(){
    const { data: { session } } = await db.auth.getSession();
    return session ? session.access_token : '';
  }

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    loginBtn.disabled = true; showMsg('');
    try {
      const { error } = await db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
      if (error) throw error;
    } catch (err) {
      showMsg(/invalid login/i.test(String(err.message)) ? '이메일 또는 비밀번호가 맞지 않아요.' : '로그인하지 못했어요: ' + err.message);
    } finally { loginBtn.disabled = false; }
  });

  $('googleBtn').addEventListener('click', async () => {
    showMsg('');
    const { error } = await db.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname, queryParams: { prompt: 'select_account' } } });
    if (error) showMsg('Google 로그인을 시작하지 못했어요: ' + error.message);
  });

  function rowHtml(t){
    const sub = [t.email, t.phone, fmtDate(t.createdAt) && '신청 ' + fmtDate(t.createdAt), '수업 ' + t.courseCount + '개 · 학생 ' + t.studentCount + '명'].filter(Boolean).map(esc).join(' · ');
    let acts;
    if (t.isAdmin) acts = '<span class="count">관리자</span>';
    else {
      const main = t.approved
        ? `<button class="ghost" data-revoke="${esc(t.id)}" data-armed-text="한 번 더 누르면 취소돼요">승인 취소</button>`
        : `<button class="primary" data-approve="${esc(t.id)}">승인</button>`;
      acts = main + `<button class="ghost" data-delete="${esc(t.id)}" data-armed-text="한 번 더 누르면 삭제돼요">삭제</button>`;
    }
    return `<div class="row"><div class="who"><b>${esc(t.name || '(이름 없음)')}</b><span>${sub}</span></div><div class="acts">${acts}</div></div>`;
  }
  function render(teachers){
    const pending = teachers.filter((t) => !t.approved);
    const approved = teachers.filter((t) => t.approved);
    $('pendingCount').textContent = pending.length;
    $('approvedCount').textContent = approved.length;
    $('pendingList').innerHTML = pending.length ? pending.map(rowHtml).join('') : '<p class="empty">승인을 기다리는 선생님이 없어요.</p>';
    $('approvedList').innerHTML = approved.length ? approved.map(rowHtml).join('') : '<p class="empty">아직 승인된 선생님이 없어요.</p>';
  }

  async function load(){
    const data = await api({ action: 'list' }, await token());
    render(data.teachers);
  }

  async function run(payload){
    try {
      const data = await api(payload, await token());
      if (data.teachers) render(data.teachers); else await load();
    } catch (err) { alert(err.message); }
  }

  // 되돌릴 수 없는 버튼(승인 취소, 삭제)은 두 번 눌러야 실행 — 4초 안에 다시 누르지 않으면 원래대로
  let armed = null, armTimer = null;
  function disarm(){
    clearTimeout(armTimer);
    if (armed && armed.btn.isConnected) { armed.btn.textContent = armed.text; armed.btn.classList.remove('danger-armed'); }
    armed = null;
  }
  body.addEventListener('click', (e) => {
    const a = e.target.closest('[data-approve]');
    if (a) { disarm(); run({ action: 'set_approved', teacherId: a.dataset.approve, approved: true }); return; }
    const btn = e.target.closest('[data-revoke], [data-delete]');
    if (!btn) return;
    const isDelete = btn.hasAttribute('data-delete');
    const id = isDelete ? btn.dataset.delete : btn.dataset.revoke;
    const key = (isDelete ? 'delete:' : 'revoke:') + id;
    if (armed && armed.key === key) {
      disarm();
      run(isDelete ? { action: 'delete_teacher', teacherId: id } : { action: 'set_approved', teacherId: id, approved: false });
      return;
    }
    disarm();
    armed = { key, btn, text: btn.textContent };
    btn.textContent = btn.dataset.armedText;
    btn.classList.add('danger-armed');
    armTimer = setTimeout(disarm, 4000);
  });

  $('toggleCreate').addEventListener('click', () => {
    const f = $('createForm');
    f.hidden = !f.hidden;
    $('toggleCreate').textContent = f.hidden ? '+ 선생님 등록' : '숨기기';
  });
  $('createForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('createBtn'), m = $('createMsg');
    btn.disabled = true; m.hidden = true;
    try {
      const data = await api({ action: 'create_teacher', name: $('cName').value, email: $('cEmail').value, phone: $('cPhone').value, password: $('cPassword').value }, await token());
      $('createForm').reset();
      $('createForm').hidden = true;
      $('toggleCreate').textContent = '+ 선생님 등록';
      if (data.teachers) render(data.teachers); else await load();
    } catch (err) { m.textContent = err.message; m.hidden = false; }
    finally { btn.disabled = false; }
  });

  const SUBJECT_LABEL = { robot: '로봇', aviation: '항공' };
  function categoryName(id){ const c = categories.find((x) => x.id === id); return c ? c.name : ''; }
  function partGroupTitle(p){
    const catLabel = p.category ? categoryName(p.category) : (SUBJECT_LABEL[p.subject] || p.subject);
    return catLabel + (p.volume != null ? p.volume + '권' : '') + '-부품리스트';
  }
  function partRowHtml(p){
    const sub = [p.color, (p.qty != null ? p.qty + '개' : '')].filter(Boolean).join(' · ');
    return `<div class="row"><div class="who"><b>${esc(p.icon ? p.icon + ' ' : '')}${esc(p.name)}</b><span>${esc(sub)}</span></div><div class="acts"><button class="ghost" data-delete-part="${esc(p.id)}" data-armed-text="한 번 더 누르면 삭제돼요">삭제</button></div></div>`;
  }
  function fillPartCategoryOptions(){
    const sel = $('pCategory');
    const cur = sel.value;
    sel.innerHTML = '<option value="">(전체 공통)</option>' + categories.map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
    sel.value = cur;
  }
  function syncPartCategoryVisibility(){
    const isRobot = $('pSubject').value === 'robot';
    $('pCategoryWrap').hidden = !isRobot;
    $('pVolumeWrap').hidden = !isRobot;
  }
  $('pSubject').addEventListener('change', syncPartCategoryVisibility);
  function renderParts(parts){
    if (!parts.length) { $('partList').innerHTML = '<p class="empty">등록된 부품이 없어요.</p>'; return; }
    const groups = new Map();
    parts.forEach((p) => {
      const key = partGroupTitle(p);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(p);
    });
    $('partList').innerHTML = Array.from(groups.entries()).map(([title, items]) =>
      `<h4 style="margin:16px 0 6px; font-size:13px; color:var(--ink-soft);">${esc(title)}</h4>${items.map(partRowHtml).join('')}`
    ).join('');
  }
  async function loadParts(){
    const data = await api({ action: 'list_parts' }, await token());
    renderParts(data.parts || []);
  }

  $('toggleCreatePart').addEventListener('click', () => {
    const f = $('createPartForm');
    f.hidden = !f.hidden;
    $('toggleCreatePart').textContent = f.hidden ? '+ 부품 등록' : '숨기기';
    if (!f.hidden) syncPartCategoryVisibility();
  });
  $('createPartForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('createPartBtn'), m = $('createPartMsg');
    btn.disabled = true; m.hidden = true;
    try {
      const isRobot = $('pSubject').value === 'robot';
      const data = await api({ action: 'add_part', name: $('pName').value, icon: $('pIcon').value, subject: $('pSubject').value, category: isRobot ? $('pCategory').value : '', volume: isRobot ? $('pVolume').value : '', qty: $('pQty').value, color: $('pColor').value }, await token());
      $('createPartForm').reset();
      $('createPartForm').hidden = true;
      $('toggleCreatePart').textContent = '+ 부품 등록';
      renderParts(data.parts || []);
    } catch (err) { m.textContent = err.message; m.hidden = false; }
    finally { btn.disabled = false; }
  });
  $('partList').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-delete-part]');
    if (!btn) return;
    const id = btn.dataset.deletePart;
    const key = 'delete-part:' + id;
    if (armed && armed.key === key) {
      disarm();
      (async () => { try { renderParts((await api({ action: 'delete_part', partId: id }, await token())).parts || []); } catch (err) { alert(err.message); } })();
      return;
    }
    disarm();
    armed = { key, btn, text: btn.textContent };
    btn.textContent = btn.dataset.armedText;
    btn.classList.add('danger-armed');
    armTimer = setTimeout(disarm, 4000);
  });

  function categoryRowHtml(c){
    return `<div class="row"><div class="who"><b>${esc(c.name)}</b><span>${c.volumes}권</span></div><div class="acts"><button class="ghost" data-edit-category="${esc(c.id)}">수정</button><button class="ghost" data-delete-category="${esc(c.id)}" data-armed-text="한 번 더 누르면 삭제돼요">삭제</button></div></div>`;
  }
  let categories = [];
  function renderCategories(){
    $('categoryList').innerHTML = categories.length ? categories.map(categoryRowHtml).join('') : '<p class="empty">등록된 카테고리가 없어요.</p>';
    fillPartCategoryOptions();
  }
  async function loadCategories(){
    const data = await api({ action: 'list_robot_categories' }, await token());
    categories = data.categories || [];
    renderCategories();
  }

  function resetCategoryForm(){
    $('createCategoryForm').reset();
    $('rId').value = '';
    $('createCategoryBtn').textContent = '등록';
  }
  $('toggleCreateCategory').addEventListener('click', () => {
    const f = $('createCategoryForm');
    if (!f.hidden && $('rId').value) { resetCategoryForm(); f.hidden = true; $('toggleCreateCategory').textContent = '+ 카테고리 등록'; return; }
    f.hidden = !f.hidden;
    $('toggleCreateCategory').textContent = f.hidden ? '+ 카테고리 등록' : '숨기기';
  });
  $('createCategoryForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('createCategoryBtn'), m = $('createCategoryMsg');
    btn.disabled = true; m.hidden = true;
    try {
      const editingId = $('rId').value;
      const payload = editingId
        ? { action: 'update_robot_category', categoryId: editingId, name: $('rName').value, volumes: Number($('rVolumes').value) }
        : { action: 'add_robot_category', name: $('rName').value, volumes: Number($('rVolumes').value) };
      const data = await api(payload, await token());
      resetCategoryForm();
      $('createCategoryForm').hidden = true;
      $('toggleCreateCategory').textContent = '+ 카테고리 등록';
      categories = data.categories || [];
      renderCategories();
    } catch (err) { m.textContent = err.message; m.hidden = false; }
    finally { btn.disabled = false; }
  });
  $('categoryList').addEventListener('click', (e) => {
    const editBtn = e.target.closest('[data-edit-category]');
    if (editBtn) {
      const c = categories.find((x) => x.id === editBtn.dataset.editCategory);
      if (!c) return;
      $('rId').value = c.id;
      $('rName').value = c.name;
      $('rVolumes').value = c.volumes;
      $('createCategoryBtn').textContent = '수정 저장';
      $('createCategoryForm').hidden = false;
      $('toggleCreateCategory').textContent = '숨기기';
      $('rName').focus();
      return;
    }
    const btn = e.target.closest('[data-delete-category]');
    if (!btn) return;
    const id = btn.dataset.deleteCategory;
    const key = 'delete-category:' + id;
    if (armed && armed.key === key) {
      disarm();
      (async () => { try { const data = await api({ action: 'delete_robot_category', categoryId: id }, await token()); categories = data.categories || []; renderCategories(); } catch (err) { alert(err.message); } })();
      return;
    }
    disarm();
    armed = { key, btn, text: btn.textContent };
    btn.textContent = btn.dataset.armedText;
    btn.classList.add('danger-armed');
    armTimer = setTimeout(disarm, 4000);
  });

  let currentUser = null;
  async function applySession(session){
    if (!session) {
      currentUser = null;
      body.hidden = true; chip.hidden = true; loginCard.hidden = false;
      return;
    }
    if (currentUser === session.user.id) return;
    try {
      await load();
      await loadCategories();
      await loadParts();
    } catch (err) {
      showMsg(err.status === 403 ? '본사 관리자 계정이 아니에요.' : err.message);
      await db.auth.signOut();
      return;
    }
    currentUser = session.user.id;
    loginCard.hidden = true; body.hidden = false;
    chip.hidden = false;
    chip.innerHTML = '<b>' + esc(session.user.email) + '</b> <button class="ghost" id="logout">로그아웃</button>';
    $('logout').addEventListener('click', () => db.auth.signOut());
    showMsg('');
  }
  db.auth.onAuthStateChange((event, session) => { setTimeout(() => applySession(session), 0); });
})();
</script>
