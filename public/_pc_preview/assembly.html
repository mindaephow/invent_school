<!doctype html><meta charset="utf-8"><title>프로보 커넥트 2단핀 결합</title>
<style>html,body{margin:0;height:100%;background:#e8eef4;font-family:'Malgun Gothic',sans-serif}#ui{position:fixed;left:10px;top:8px;font-size:13px;color:#234}button{font-size:13px;padding:5px 10px;margin:2px;cursor:pointer}</style>
<div id="ui"><div>드래그 회전 · 휠 확대 — 1X5블럭 2장 + 2단핀 (길이 10 = 블럭 두 장)</div>
<button onclick="setPin(0)">① 꽂은 모습</button><button onclick="setPin(1)">② 90° 돌린(잠긴) 모습</button><button onclick="setPin(2)">핀 빼기(분리)</button><button onclick="cut=!cut;apply()">단면 켜기/끄기</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.localClippingEnabled=true;document.body.appendChild(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0xe8eef4);
const C=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,1,2000);
S.add(new THREE.AmbientLight(0xffffff,.6));const L=new THREE.DirectionalLight(0xffffff,.9);L.position.set(40,80,60);S.add(L);
const plane=new THREE.Plane(new THREE.Vector3(0,0,-1),0.9); let cut=false;
const mats=[];function mat(c,o){const m=new THREE.MeshStandardMaterial({color:c,roughness:.6,opacity:o,transparent:o<1,side:THREE.DoubleSide});mats.push(m);return m}
function load(url,m,fn){return fetch(url).then(r=>r.arrayBuffer()).then(b=>{const dv=new DataView(b),n=dv.getUint32(80,true),pos=new Float32Array(n*9);
 for(let t=0;t<n;t++)for(let v=0;v<3;v++){const o=84+t*50+12+v*12;pos[t*9+v*3]=dv.getFloat32(o,true);pos[t*9+v*3+1]=dv.getFloat32(o+8,true);pos[t*9+v*3+2]=-dv.getFloat32(o+4,true)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.computeVertexNormals();const me=new THREE.Mesh(g,m);S.add(me);fn(me);return me})}
let b1,b2,p0,p1;
Promise.all([
 load('1X5.stl',mat(0xf5f5f3,1),m=>{b1=m;m.position.y=0}),
 load('1X5.stl',mat(0xe6e6e3,1),m=>{b2=m;m.position.y=-5}),
 load('pin2.stl',mat(0x1e50b4,1),m=>{p0=m}),
 load('pin2r.stl',mat(0x1e50b4,1),m=>{p1=m})
]).then(()=>{setPin(0)});
function setPin(k){p0.visible=(k==0||k==2);p1.visible=(k==1);const y=(k==2)?25:5;p0.position.y=y;p1.position.y=y;window.cur=k;apply()}
function apply(){mats.forEach(m=>{m.clippingPlanes=cut?[plane]:[]});}
let th=-.5,ph=1.0,rad=60;const upd=()=>{C.position.set(rad*Math.sin(ph)*Math.sin(th),rad*Math.cos(ph),rad*Math.sin(ph)*Math.cos(th));C.lookAt(0,2,0);R.render(S,C)};
let d=false,px,py;R.domElement.onmousedown=e=>{d=true;px=e.clientX;py=e.clientY};onmouseup=()=>d=false;
onmousemove=e=>{if(!d)return;th-=(e.clientX-px)*.01;ph=Math.max(.05,Math.min(3.1,ph-(e.clientY-py)*.01));px=e.clientX;py=e.clientY};
R.domElement.onwheel=e=>{rad=Math.max(15,Math.min(300,rad*(1+e.deltaY*.001)));e.preventDefault()};
(function loop(){upd();requestAnimationFrame(loop)})();
</script>
